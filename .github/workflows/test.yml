name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate changelog matches package version
        run: npm run check:changelog

      - name: Audit dependencies
        run: npm audit --audit-level=moderate || true

  unit-tests:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_STELLAR_NETWORK: testnet
      NEXT_PUBLIC_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      NEXT_PUBLIC_RPC_URL: https://soroban-testnet.stellar.org
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate changelog
        run: npm run check:changelog

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Unit tests
        run: npm run test

      - name: Contract smoke test (mocked SDK)
        run: npx vitest run tests/unit/contract-smoke.test.ts --reporter=verbose
