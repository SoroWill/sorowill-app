name: Reminder cron

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  dispatch-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder dispatch
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --show-error --silent -X POST "${{ secrets.REMINDER_DISPATCH_URL }}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"
